name: Update coverage

# Runs whenever the "Sync Strava" Chrome bookmark saves new activities to activities.json.
# It works out the upazilas, unions, villages and countries, then saves coverage.json.
on:
  push:
    branches: [main]
    paths: [activities.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Work out upazilas, unions, villages and countries
        run: node scripts/sync.js
        env:
          NO_STRAVA: "1"

      - name: Save the results
        run: |
          git config user.name "strava-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json cache.json villages.json geo
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update coverage"
            git pull --rebase --autostash
            git push
          fi
